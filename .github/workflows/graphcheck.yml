name: GraphCheck

on:
  pull_request:

env:
  SEED_FILE: seed-clean.cypher

jobs:
  graphcheck:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.26.28
        env:
          NEO4J_AUTH: neo4j/${{ secrets.NEO4J_PASSWORD }}
        ports:
          - 7687:7687
        options: >-
          --health-cmd "wget -O /dev/null -q http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Seed the fraud-ring fixture
        env:
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
        run: |
          curl -fsSL -o "$SEED_FILE" "https://raw.githubusercontent.com/graphora/graphcheck-fraud-ring-fixture/5dc14f81dd6f834f166a102b65e9866a240fa035/fixtures/fraud-ring/$SEED_FILE"
          curl -fsSL https://dist.neo4j.org/cypher-shell/cypher-shell_5.26.0_all.deb -o cypher-shell.deb
          sudo dpkg -i cypher-shell.deb || sudo apt-get install -f -y
          cypher-shell -a bolt://localhost:7687 -u neo4j -p "$NEO4J_PASSWORD" --fail-fast -f "$SEED_FILE"
      - uses: graphora/graphcheck-action@v1
        with:
          profile: ci
          uri: bolt://localhost:7687
          user: neo4j
          suite: fraud-ring-conformance
        env:
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}